# ============================================================
# Nginx — site + API própria na mesma VPS.
# Copie para /etc/nginx/sites-available/mro e ative com:
#   ln -s /etc/nginx/sites-available/mro /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
# O certbot ajusta os blocos de TLS automaticamente.
# ============================================================

# ---------- Site (React) ----------
server {
    listen 80;
    listen [::]:80;
    server_name maisresultadosonline.com.br www.maisresultadosonline.com.br;

    root /var/www/mro/dist;
    index index.html;

    client_max_body_size 300M;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # SPA: qualquer rota desconhecida entrega o index.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html nunca em cache, senão o deploy não aparece para quem já visitou.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Assets com hash podem ser cacheados agressivamente.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}

# ---------- API própria (REST, Auth, Storage, Funções, Realtime) ----------
server {
    listen 80;
    listen [::]:80;
    server_name api.maisresultadosonline.com.br;

    client_max_body_size 300M;
    client_body_timeout 600s;

    # CORS robusto para evitar mascarar erros 502/504 no navegador.
    # O 'always' é fundamental para que o navegador veja o erro real do backend.
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
    add_header 'Access-Control-Allow-Headers' 'authorization,apikey,content-type,x-client-info,range,if-range' always;
    add_header 'Access-Control-Expose-Headers' 'Content-Range,X-Total-Count' always;

    # Preflight OPTIONS direto no Nginx (opcional, mas libera o Node)
    if ($request_method = 'OPTIONS') {
        return 204;
    }

    # Mídias passam pelo backend para preservar Range/206 e recuperar do
    # fallback qualquer arquivo que não tenha vindo na migração.
    location /storage/v1/object/public/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
    }

    # WebSocket do realtime.
    location /realtime/v1 {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 30s;
    }
}
